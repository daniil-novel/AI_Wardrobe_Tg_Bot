services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_wardrobe}
      POSTGRES_USER: ${POSTGRES_USER:-ai_wardrobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_wardrobe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ai_wardrobe}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ai-wardrobe-private}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY_ID}\" \"$${S3_SECRET_ACCESS_KEY}\"; do sleep 2; done;
      mc mb --ignore-existing local/\"$${S3_BUCKET}\";
      "

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      MINIAPP_PUBLIC_URL: ${MINIAPP_PUBLIC_URL:-http://localhost:5173}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_wardrobe}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-ai_wardrobe}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_wardrobe}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-ai_wardrobe}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://ai_wardrobe:change-me@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-long-random-secret}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL_IMAGE: ${OPENROUTER_MODEL_IMAGE:-google/gemini-2.5-pro}
      OPENROUTER_MODEL_TEXT: ${OPENROUTER_MODEL_TEXT:-google/gemini-2.5-pro}
      OPENROUTER_MODEL_IMAGE_GEN: ${OPENROUTER_MODEL_IMAGE_GEN:-google/gemini-2.5-flash-image}
      AI_EXECUTION_MODE: ${AI_EXECUTION_MODE:-api}
      AI_HYBRID_PREFERENCE: ${AI_HYBRID_PREFERENCE:-runner_first}
      CODEX_CLI_COMMAND: ${CODEX_CLI_COMMAND:-codex}
      CODEX_CLI_MODEL: ${CODEX_CLI_MODEL:-}
      CODEX_CLI_LOCAL_PROVIDER: ${CODEX_CLI_LOCAL_PROVIDER:-none}
      CODEX_CLI_TIMEOUT_SECONDS: ${CODEX_CLI_TIMEOUT_SECONDS:-180}
      CODEX_CLI_MAX_OUTPUT_BYTES: ${CODEX_CLI_MAX_OUTPUT_BYTES:-1000000}
      CODEX_CLI_IGNORE_USER_CONFIG: ${CODEX_CLI_IGNORE_USER_CONFIG:-true}
      CODEX_CLI_ALLOW_API_KEY_ENV: ${CODEX_CLI_ALLOW_API_KEY_ENV:-false}
      CODEX_RUNNER_TOKEN: ${CODEX_RUNNER_TOKEN:-}
      CODEX_RUNNER_JOB_TTL_SECONDS: ${CODEX_RUNNER_JOB_TTL_SECONDS:-300}
      CODEX_RUNNER_WAIT_TIMEOUT_SECONDS: ${CODEX_RUNNER_WAIT_TIMEOUT_SECONDS:-90}
      CODEX_RUNNER_CLAIM_TIMEOUT_SECONDS: ${CODEX_RUNNER_CLAIM_TIMEOUT_SECONDS:-15}
      CODEX_RUNNER_HEARTBEAT_TTL_SECONDS: ${CODEX_RUNNER_HEARTBEAT_TTL_SECONDS:-40}
      CODEX_RUNNER_MAX_PAYLOAD_BYTES: ${CODEX_RUNNER_MAX_PAYLOAD_BYTES:-16000000}
      SUBSCRIPTIONS_ENABLED: ${SUBSCRIPTIONS_ENABLED:-true}
      ENABLE_BILLING_PAYMENTS: ${ENABLE_BILLING_PAYMENTS:-false}
      PROMO_HASH_SECRET: ${PROMO_HASH_SECRET:-}
      PREMIUM_AVATAR_GENERATIONS_PER_MONTH: ${PREMIUM_AVATAR_GENERATIONS_PER_MONTH:-2}
      PREMIUM_TRY_ONS_PER_MONTH: ${PREMIUM_TRY_ONS_PER_MONTH:-6}
      PRO_AVATAR_GENERATIONS_PER_MONTH: ${PRO_AVATAR_GENERATIONS_PER_MONTH:-5}
      PRO_TRY_ONS_PER_MONTH: ${PRO_TRY_ONS_PER_MONTH:-15}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ai-wardrobe-private}
      S3_REGION: ${S3_REGION:-us-east-1}
    command: /app/.venv/bin/uvicorn aiwardrobe_api.main:create_app --factory --host 0.0.0.0 --port 8000
    volumes:
      - ./logs:/app/logs
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_wardrobe}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-ai_wardrobe}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_wardrobe}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-ai_wardrobe}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://ai_wardrobe:change-me@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL_IMAGE: ${OPENROUTER_MODEL_IMAGE:-google/gemini-2.5-pro}
      OPENROUTER_MODEL_TEXT: ${OPENROUTER_MODEL_TEXT:-google/gemini-2.5-pro}
      OPENROUTER_MODEL_IMAGE_GEN: ${OPENROUTER_MODEL_IMAGE_GEN:-google/gemini-2.5-flash-image}
      AI_EXECUTION_MODE: ${AI_EXECUTION_MODE:-api}
      AI_HYBRID_PREFERENCE: ${AI_HYBRID_PREFERENCE:-runner_first}
      CODEX_CLI_COMMAND: ${CODEX_CLI_COMMAND:-codex}
      CODEX_CLI_MODEL: ${CODEX_CLI_MODEL:-}
      CODEX_CLI_LOCAL_PROVIDER: ${CODEX_CLI_LOCAL_PROVIDER:-none}
      CODEX_CLI_TIMEOUT_SECONDS: ${CODEX_CLI_TIMEOUT_SECONDS:-180}
      CODEX_CLI_MAX_OUTPUT_BYTES: ${CODEX_CLI_MAX_OUTPUT_BYTES:-1000000}
      CODEX_CLI_IGNORE_USER_CONFIG: ${CODEX_CLI_IGNORE_USER_CONFIG:-true}
      CODEX_CLI_ALLOW_API_KEY_ENV: ${CODEX_CLI_ALLOW_API_KEY_ENV:-false}
      CODEX_RUNNER_TOKEN: ${CODEX_RUNNER_TOKEN:-}
      CODEX_RUNNER_JOB_TTL_SECONDS: ${CODEX_RUNNER_JOB_TTL_SECONDS:-300}
      CODEX_RUNNER_WAIT_TIMEOUT_SECONDS: ${CODEX_RUNNER_WAIT_TIMEOUT_SECONDS:-90}
      CODEX_RUNNER_CLAIM_TIMEOUT_SECONDS: ${CODEX_RUNNER_CLAIM_TIMEOUT_SECONDS:-15}
      CODEX_RUNNER_HEARTBEAT_TTL_SECONDS: ${CODEX_RUNNER_HEARTBEAT_TTL_SECONDS:-40}
      CODEX_RUNNER_MAX_PAYLOAD_BYTES: ${CODEX_RUNNER_MAX_PAYLOAD_BYTES:-16000000}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ai-wardrobe-private}
      S3_REGION: ${S3_REGION:-us-east-1}
    command: /app/.venv/bin/celery -A aiwardrobe_worker.celery_app:celery_app worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2} -Q celery,ai,research,recommendations,notifications
    volumes:
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  bot:
    build: .
    profiles:
      - telegram
    environment:
      APP_ENV: ${APP_ENV:-local}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MINIAPP_PUBLIC_URL: ${MINIAPP_PUBLIC_URL:-http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
    command: /app/.venv/bin/python -m aiwardrobe_bot.main
    depends_on:
      - api
      - redis

  miniapp:
    image: node:22-alpine
    working_dir: /app/apps/miniapp
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      VITE_SUBSCRIPTIONS_ENABLED: ${SUBSCRIPTIONS_ENABLED:-true}
    ports:
      - "${MINIAPP_HOST_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    volumes:
      - .:/app

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
